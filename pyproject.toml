[project]
name = "ais-voice"
version = "0.1.0"
description = "AISIMA voice service (Phase 2) — Pipecat voice agent for dental clinic website redesign outreach. Separate service from Phase 1 (ais-autonomous-sales); anthropic 1.x here."
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,webrtc,deepgram,cartesia]>=1.15,<2.0",
    "anthropic>=1.17,<2",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
